# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: sungrow2mqtt
version: "1.2.0"
slug: sungrow2mqtt
description: This add-on integrates Sungrow SHx inverters into Home Assistant via Modbus TCP using MQTT. It reads register data and automatically provides them as sensors and other entities.
arch:
  - aarch64
  - amd64
init: false
map:
  - share:rw
options:
  inverter:
    host: ""
    port: 502
    slave: 1
    winet_connection: false
  mqtt:
    host: ""
    port: 1883
    username: ""
    password: ""
    homeassistant: true
  scan:
    delay: 5
    timeout: 30
    interval:
      realtime: 5
      fast: 10
      medium: 60
      slowest: 600
  log_level: "INFO"
schema:
  inverter:
    host: str
    port: port
    slave: int
    winet_connection: bool
  mqtt:
    host: str
    port: port
    username: str
    password: password
    homeassistant: bool
  scan:
    delay: int(1,15)
    timeout: int(10,60)
    interval:
      realtime: int(1,5)
      fast: int(1,10)
      medium: int(30,60)
      slowest: int(100,600)
  log_level: "list(INFO|WARNING|ERROR|DEBUG)"
